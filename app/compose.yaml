services:
  web:
    image: cloud-native-app:1.1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    image: cloud-native-backend:1.0
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
